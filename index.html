<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#60754d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Guestflow — Les Oliviers</title>

<script>
(function(){
  const p = new URLSearchParams(location.search);
  const lang = ['fr','en','es','de'].includes(p.get('lang')) ? p.get('lang') : 'fr';
  document.documentElement.lang = lang;
  const map = {
    fr:'./manifest-cacouech.json',
    en:'./manifest-cacouech-en.json',
    es:'./manifest-cacouech-es.json',
    de:'./manifest-cacouech-de.json'
  };
  const m = document.createElement('link');
  m.rel='manifest';
  m.href=map[lang];
  document.head.appendChild(m);
})();
</script>

<style>
:root{
  --green:#36582f;
  --green2:#58704a;
  --ink:#101710;
  --cream:#f7f3e8;
  --paper:rgba(255,255,255,.94);
  --soft:rgba(246,243,233,.95);
}
*{box-sizing:border-box}
html,body{margin:0;background:#f5f1e8;color:var(--ink)}
body{
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
}
.poster{
  position:relative;
  width:100%;
  max-width:941px;
  aspect-ratio:941/1672;
  margin:0 auto;
  overflow:hidden;
  background:#f5f1e8;
}
.bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:fill;
  user-select:none;-webkit-user-drag:none;
}
.abs{position:absolute;z-index:3}

/* Marque */
.brand{left:7%;top:6.1%;width:42%}
.brand-name{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(26px,7vw,66px);
  line-height:.95;font-weight:600;letter-spacing:-.05em
}
.brand-sub{
  margin-left:27%;margin-top:.55em;
  font-size:clamp(10px,2.5vw,22px);
  letter-spacing:.30em
}

/* slogan manuscrit */
.slogan{
  right:10%;top:5.4%;width:28%;
  font-family:"Segoe Script","Brush Script MT",cursive;
  color:#163e20;font-style:italic;
  font-size:clamp(20px,4.4vw,42px);
  line-height:1.02;text-align:center;
  transform:rotate(-6deg)
}

/* vrais boutons de langue */
.langbar{
  left:6.1%;top:14.7%;width:49.5%;height:4.4%;
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:.4%;
  padding:.45%;
  border-radius:999px;
  background:rgba(245,242,232,.92);
}
.lang{
  border:0;border-radius:999px;background:transparent;
  display:flex;align-items:center;justify-content:center;
  gap:.35em;cursor:pointer;color:#111;
  font-size:clamp(11px,2.3vw,20px);
  font-weight:500
}
.lang.active{background:#607552;color:white;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.flag{font-size:1.35em}

/* titre / intro */
.hero{left:6%;top:20.5%;width:50%}
.title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(28px,6vw,58px);
  line-height:1.03;font-weight:600;letter-spacing:-.035em
}
.rule{width:16%;height:4px;background:#a88a35;margin:3% 0}
.intro{
  width:84%;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(15px,3.25vw,31px);
  line-height:1.27
}
.experience{
  left:7%;top:40.4%;width:39%;
  font-family:"Segoe Script","Brush Script MT",cursive;
  font-style:italic;color:#173f21;
  font-size:clamp(20px,4vw,38px);
  line-height:1.05;transform:rotate(-5deg)
}

/* étapes */
.steps{left:25.7%;top:47.1%;width:27%;height:20%}
.steptext{
  position:absolute;left:0;width:100%;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(14px,2.7vw,26px);
  line-height:1.03
}
.st1{top:2.5%}.st2{top:35.3%}.st3{top:69.2%}

/* badges */
.badges{
  left:11.5%;top:70.8%;width:81.5%;height:4.2%;
  display:grid;grid-template-columns:repeat(3,1fr);gap:2.1%
}
.badge{
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(11px,2.15vw,21px);
  white-space:nowrap
}

/* bouton installation réel */
.install{
  left:5.4%;top:75.8%;width:87.5%;height:5.4%;
  z-index:6;border:0;border-radius:999px;background:transparent;
  cursor:pointer;color:white;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(18px,3.5vw,33px);
  display:flex;align-items:center;justify-content:center
}
.availability{
  left:31%;top:82.3%;width:40%;text-align:center;
  font-size:clamp(10px,2.0vw,19px)
}
.values{
  left:25%;top:86.4%;width:49%;text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(8px,1.55vw,15px);
  letter-spacing:.22em;color:#26462b
}
.closing{
  right:5%;top:82.5%;width:27%;
  font-family:"Segoe Script","Brush Script MT",cursive;
  color:#173f21;font-style:italic;
  font-size:clamp(18px,3.6vw,35px);
  line-height:1.03;text-align:center;
  transform:rotate(-7deg)
}

/* Mini-interface dans le smartphone :
   un panneau propre couvre l'intérieur décoratif de la base pour éviter tout doublon. */
.phonepanel{
  left:59.8%;top:30.6%;width:31.2%;height:34.8%;
  transform:rotate(3.1deg);
  transform-origin:center;
  border-radius:8% 8% 7% 7%;
  padding:3.1% 2.2% 2%;
  overflow:hidden;
  background:rgba(248,246,238,.93);
  box-shadow:inset 0 0 0 1px rgba(20,40,20,.05);
}
.phonebrand{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(13px,2.4vw,23px);
  font-weight:600;text-align:center
}
.phonesub{
  font-size:clamp(5px,.85vw,9px);
  letter-spacing:.18em;text-align:center;margin-top:.25em
}
.phonehello{
  margin-top:8%;
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;font-weight:700;
  font-size:clamp(16px,3vw,29px)
}
.phonecopy{
  margin-top:3%;
  font-size:clamp(8px,1.45vw,14px);
  line-height:1.2;width:90%
}
.search{
  margin-top:6%;height:9%;
  border-radius:999px;background:white;
  display:flex;align-items:center;padding:0 6%;
  color:#747474;font-size:clamp(7px,1.25vw,12px);
  box-shadow:0 2px 8px rgba(0,0,0,.05)
}
.grid{
  margin-top:6%;display:grid;grid-template-columns:repeat(3,1fr);gap:4%;
}
.tile{
  aspect-ratio:1/.9;border-radius:13%;background:rgba(255,255,255,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5%;font-size:clamp(5px,.9vw,9px);text-align:center
}
.tile svg{width:33%;height:33%;stroke:#244c29;fill:none;stroke-width:2}
.tile.emergency svg{stroke:#c82929}
.phonetag{
  position:absolute;left:10%;right:10%;bottom:4%;
  text-align:center;font:italic clamp(6px,1vw,10px) Georgia,serif;color:#555
}

.toast{
  position:fixed;z-index:20;left:50%;bottom:18px;
  transform:translateX(-50%) translateY(16px);
  padding:11px 16px;border-radius:12px;background:#183f23;color:white;
  font-size:14px;opacity:0;pointer-events:none;transition:.2s;
  max-width:90vw;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:942px){
  body{display:flex;justify-content:center}
}
</style>
</head>

<body>
<main class="poster">
  <img class="bg" src="./accueil-guestflow-premium.png" alt="Guestflow — Les Oliviers">

  <div class="abs brand">
    <div class="brand-name">Guestflow</div>

  <div class="abs slogan" data-i18n="slogan"></div>

  <div class="abs langbar" aria-label="Langue">
    <button class="lang" data-lang="fr"><span class="flag">🇫🇷</span>FR</button>
    <button class="lang" data-lang="en"><span class="flag">🇬🇧</span>EN</button>
    <button class="lang" data-lang="es"><span class="flag">🇪🇸</span>ES</button>
    <button class="lang" data-lang="de"><span class="flag">🇩🇪</span>DE</button>

  <section class="abs hero">

  </div>

  <button class="abs install" id="installBtn" data-i18n="install" aria-label="Installer Guestflow"></button>

  <div class="abs availability" data-i18n="availability"></div>
  <div class="abs values" data-i18n="values"></div>
  <div class="abs closing" data-i18n="closing"></div>

  <section class="abs phonepanel" aria-hidden="true">
    <div class="phonebrand">Guestflow</div>
    <div class="phonesub">LES OLIVIERS</div>
    <div class="phonehello" data-i18n="phoneHello"></div>
    <div class="phonecopy" data-i18n="phoneCopy"></div>
    <div class="search" data-i18n="phoneInput"></div>

    <div class="grid">
      <div class="tile">
        <svg viewBox="0 0 24 24"><path d="M5 17h14M6 17l1-6h10l1 6M8 11l1-3h6l1 3M7 17v2M17 17v2"/></svg>
        <span data-i18n="p1"></span>
      </div>
      <div class="tile">
        <svg viewBox="0 0 24 24"><path d="M7 3v8M10 3v8M7 7h3M8.5 11v10M15 3c2 3 2 6 0 8v10"/></svg>
        <span data-i18n="p2"></span>
      </div>
      <div class="tile">
        <svg viewBox="0 0 24 24"><path d="M12 21s6-5 6-11a6 6 0 1 0-12 0c0 6 6 11 6 11z"/><circle cx="12" cy="10" r="2"/></svg>
        <span data-i18n="p3"></span>
      </div>
      <div class="tile">
        <svg viewBox="0 0 24 24"><path d="M4 16h16M6 16V8h12v8M8 8V5h8v3M7 16v3M17 16v3"/></svg>
        <span data-i18n="p4"></span>
      </div>
      <div class="tile">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="2"/><circle cx="16" cy="8" r="2"/><circle cx="6" cy="13" r="2"/><circle cx="18" cy="13" r="2"/><path d="M9 18c1-3 5-3 6 0 0 2-6 2-6 0z"/></svg>
        <span data-i18n="p5"></span>
      </div>
      <div class="tile emergency">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>
        <span data-i18n="p6"></span>
      </div>
    </div>
    <div class="phonetag" data-i18n="phoneTag"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const TEXT = {

  },
  en:{

    title:"Add Guestflow<br>to your phone",
    intro:"Install your stay concierge in just a few seconds and enjoy personalised assistance throughout your stay.",
    step1:"Install<br>Guestflow",
    step2:"Add it to your<br>Home Screen",
    step3:"Open Guestflow<br>and ask your questions",
    badge1:"No account",badge2:"Fast response",badge3:"Secure data",
    install:"Install Guestflow",
    availability:"Available on iPhone and Android",
    values:"NATURE · SHARING · AUTHENTICITY",
    closing:"Enjoy every<br>moment!",
    phoneHello:"Hello!",
    phoneCopy:"How can I help you?",
    phoneInput:"Ask your question…",
    p1:"Activities",p2:"Restaurants",p3:"Nearby",p4:"Transport",p5:"Pets",p6:"Emergency",
    phoneTag:"Places that matter",

    wait:"Your browser will offer installation as soon as Guestflow is installable."
  },

    title:"Añade Guestflow<br>a tu teléfono",

    step2:"Añádelo a tu<br>pantalla de inicio",
    step3:"Abre Guestflow<br>y haz tus preguntas",
    badge1:"Sin cuenta",badge2:"Respuesta rápida",badge3:"Datos seguros",
    install:"Instalar Guestflow",

    values:"NATURALEZA · COMPARTIR · AUTENTICIDAD",

    values:"NATUR · TEILEN · AUTHENTIZITÄT",
    closing:"Genießen Sie<br>jeden Augenblick!",
    phoneHello:"Hallo!",
    phoneCopy:"Wie kann ich Ihnen helfen?",
    phoneInput:"Stellen Sie Ihre Frage…",
    p1:"Aktivitäten",p2:"Restaurants",p3:"In der Nähe",p4:"Transport",p5:"Tiere",p6:"Notfall",

  }
};

const params = new URLSearchParams(location.search);
let lang = ['fr','en','es','de'].includes(params.get('lang')) ? params.get('lang') : 'fr';

function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.innerHTML = TEXT[lang][el.dataset.i18n] ?? '';
  });
  document.querySelectorAll('.lang').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.lang===lang);
  });
}
render();

document.querySelectorAll('.lang').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(btn.dataset.lang===lang) return;
    const u=new URL(location.href);
    u.searchParams.set('lang',btn.dataset.lang);
    location.assign(u.toString());
  });
});

let deferredPrompt=null;
const toast=document.getElementById('toast');
function say(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(say.t);
  say.t=setTimeout(()=>toast.classList.remove('show'),4200);
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    say(TEXT[lang].ios); return;
  }
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
  }else{
    say(TEXT[lang].wait);
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
