<script>
(function(){
 const p=new URLSearchParams(location.search);
 const lang=['fr','en','es','de'].includes(p.get('lang'))?p.get('lang'):'fr';
 document.documentElement.lang=lang;
 const href={fr:'./manifest-cacouech.json',en:'./manifest-cacouech-en.json',es:'./manifest-cacouech-es.json',de:'./manifest-cacouech-de.json'}[lang];

<style>

.s1{top:785px}.s2{top:900px}.s3{top:1014px}

.phone .l1{left:0;top:288px}.phone .l2{left:86px;top:288px}.phone .l3{left:172px;top:288px}
.phone .l4{left:0;top:374px}.phone .l5{left:86px;top:374px}.phone .l6{left:172px;top:374px}

</style>

<body>
<div id="stage"><div id="design">
<img src="./accueil-guestflow-premium.png" alt="">
<div class="overlay brand"><div class="name">Guestflow</div><div class="sub">Les Oliviers</div></div>
<div class="overlay slogan" data-k="slogan"></div>
<div class="overlay langbar">
<button class="lang" data-lang="fr"><span class="flag">🇫🇷</span>FR</button>

<script>
const TXT={
fr:{slogan:'Bien plus<br>qu’un séjour',title:'Ajoutez Guestflow<br>à votre téléphone',intro:'Installez votre concierge de séjour en quelques secondes et profitez d’un accompagnement personnalisé tout au long de votre séjour.',step1:'Installez<br>Guestflow',step2:'Ajoutez-le à votre<br>écran d’accueil',step3:'Ouvrez Guestflow<br>et posez vos questions',badge1:'Sans compte',badge2:'Réponse rapide',badge3:'Données sécurisées',install:'Installer Guestflow',availability:'Disponible sur iPhone et Android',values:'NATURE · PARTAGE · AUTHENTICITÉ',closing:'Profitez de<br>chaque instant !',phoneHello:'Bonjour !',phoneCopy:'Comment puis-je vous aider ?',phoneInput:'Posez votre question…',p1:'Activités',p2:'Restaurants',p3:'À proximité',p4:'Transport',p5:'Animaux',p6:'Urgence',phoneTag:'Des lieux qui ont du sens',ios:'Sur iPhone : Partager puis « Sur l’écran d’accueil ».',wait:'Votre navigateur proposera l’installation lorsque Guestflow sera installable.'},
en:{slogan:'More than<br>just a stay',title:'Add Guestflow<br>to your phone',intro:'Install your stay concierge in just a few seconds and enjoy personalised assistance throughout your stay.',step1:'Install<br>Guestflow',step2:'Add it to your<br>Home Screen',step3:'Open Guestflow<br>and ask your questions',badge1:'No account',badge2:'Fast response',badge3:'Secure data',install:'Install Guestflow',availability:'Available on iPhone and Android',values:'NATURE · SHARING · AUTHENTICITY',closing:'Enjoy every<br>moment!',phoneHello:'Hello!',phoneCopy:'How can I help you?',phoneInput:'Ask your question…',p1:'Activities',p2:'Restaurants',p3:'Nearby',p4:'Transport',p5:'Pets',p6:'Emergency',phoneTag:'Places that matter',ios:'On iPhone: Share, then “Add to Home Screen”.',wait:'Your browser will offer installation when Guestflow is installable.'},
es:{slogan:'Mucho más<br>que una estancia',title:'Añade Guestflow<br>a tu teléfono',intro:'Instala tu conserje de estancia en solo unos segundos y disfruta de una asistencia personalizada durante toda tu estancia.',step1:'Instala<br>Guestflow',step2:'Añádelo a tu<br>pantalla de inicio',step3:'Abre Guestflow<br>y haz tus preguntas',badge1:'Sin cuenta',badge2:'Respuesta rápida',badge3:'Datos seguros',install:'Instalar Guestflow',availability:'Disponible en iPhone y Android',values:'NATURALEZA · COMPARTIR · AUTENTICIDAD',closing:'¡Disfruta de<br>cada instante!',phoneHello:'¡Hola!',phoneCopy:'¿Cómo puedo ayudarte?',phoneInput:'Haz tu pregunta…',p1:'Actividades',p2:'Restaurantes',p3:'Cerca',p4:'Transporte',p5:'Animales',p6:'Urgencia',phoneTag:'Lugares con sentido',ios:'En iPhone: Compartir y «Añadir a pantalla de inicio».',wait:'El navegador ofrecerá la instalación cuando Guestflow esté disponible.'},
de:{slogan:'Mehr als nur<br>ein Aufenthalt',title:'Guestflow auf<br>Ihr Smartphone',intro:'Installieren Sie Ihren Aufenthalts-Concierge in nur wenigen Sekunden und genießen Sie persönliche Unterstützung während Ihres gesamten Aufenthalts.',step1:'Guestflow<br>installieren',step2:'Zum Startbildschirm<br>hinzufügen',step3:'Guestflow öffnen<br>und Fragen stellen',badge1:'Ohne Konto',badge2:'Schnelle Antwort',badge3:'Sichere Daten',install:'Guestflow installieren',availability:'Verfügbar auf iPhone und Android',values:'NATUR · TEILEN · AUTHENTIZITÄT',closing:'Genießen Sie<br>jeden Augenblick!',phoneHello:'Hallo!',phoneCopy:'Wie kann ich Ihnen helfen?',phoneInput:'Stellen Sie Ihre Frage…',p1:'Aktivitäten',p2:'Restaurants',p3:'In der Nähe',p4:'Transport',p5:'Tiere',p6:'Notfall',phoneTag:'Orte mit Bedeutung',ios:'Auf dem iPhone: Teilen, dann „Zum Home-Bildschirm“.',wait:'Ihr Browser bietet die Installation an, sobald Guestflow installierbar ist.'}}
const qs=new URLSearchParams(location.search);let lang=['fr','en','es','de'].includes(qs.get('lang'))?qs.get('lang'):'fr';
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-k]').forEach(e=>e.innerHTML=TXT[lang][e.dataset.k]||'');document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{if(b.dataset.lang===lang)return;const u=new URL(location.href);u.searchParams.set('lang',b.dataset.lang);location.href=u.toString();});
function fit(){const W=innerWidth,H=innerHeight,s=Math.max(W/941,H/1672),x=(W-941*s)/2,y=(H-1672*s)/2;const d=document.getElementById('design');d.style.left=x+'px';d.style.top=y+'px';d.style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();render();
let deferred=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});const t=document.getElementById('toast');function toast(m){t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),4000)}
document.getElementById('install').onclick=async()=>{if(/iphone|ipad|ipod/i.test(navigator.userAgent)){toast(TXT[lang].ios);return}if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else toast(TXT[lang].wait)};
</script>
