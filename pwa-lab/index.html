<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#596b50">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Guestflow PWA Lab A</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f1e7;color:#2f382f}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{max-width:520px;width:100%;background:white;border-radius:22px;padding:28px;box-sizing:border-box;
           box-shadow:0 12px 36px rgba(0,0,0,.12);text-align:center}
    h1{margin:0 0 14px;font-size:28px}
    .marker{font-size:34px;font-weight:800;margin:20px 0;color:#596b50}
    .status{font-size:14px;line-height:1.5;color:#667066}
    button{margin-top:18px;padding:12px 18px;border:0;border-radius:12px;background:#596b50;color:white;
            font-weight:700;font-size:16px}
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Guestflow — PWA Lab</h1>
    <div class="marker">VERSION A</div>
    <div class="status" id="status">Initialisation…</div>
    <button id="installBtn" hidden>Installer le test</button>
  </section>
</main>
<script>
const BUILD = "A";
let deferredPrompt = null;
const statusEl = document.getElementById("status");
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.hidden = false;
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  await deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch(e) {}
  deferredPrompt = null;
  installBtn.hidden = true;
});

if ("serviceWorker" in navigator) {
  let reloading = false;

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("./sw.js", {
        scope: "./",
        updateViaCache: "none"
      });

      await reg.update();

      if (reg.waiting) {
        reg.waiting.postMessage({type:"SKIP_WAITING"});
      }

      reg.addEventListener("updatefound", () => {
        const worker = reg.installing;
        if (!worker) return;
        worker.addEventListener("statechange", () => {
          if (worker.state === "installed" && navigator.serviceWorker.controller) {
            worker.postMessage({type:"SKIP_WAITING"});
          }
        });
      });

      statusEl.textContent = "Build " + BUILD + " — service worker prêt";
    } catch (err) {
      statusEl.textContent = "Erreur service worker : " + err;
    }
  });
} else {
  statusEl.textContent = "Service worker non supporté";
}
</script>
</body>
</html>
