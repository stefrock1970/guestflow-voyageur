<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#596b50">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Guestflow PWA Lab C</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f1e7;color:#2f382f}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{max-width:560px;width:100%;background:#fff;border-radius:22px;padding:28px;box-sizing:border-box;box-shadow:0 12px 36px rgba(0,0,0,.12);text-align:center}
    h1{margin:0 0 14px;font-size:28px}
    .marker{font-size:36px;font-weight:800;margin:20px 0;color:#596b50}
    .status{font-size:14px;line-height:1.55;color:#667066;white-space:pre-line}
  </style>
</head>
<body>
<main><section class="card">
  <h1>Guestflow — PWA Lab</h1>
  <div class="marker">VERSION C — MÉCANISME NEUF</div>
  <div class="status" id="status">Initialisation…</div>
</section></main>
<script>
const PAGE_BUILD = "C";
const statusEl = document.getElementById("status");
let reloading = false;

function showStatus(extra) {
  const ctrl = navigator.serviceWorker && navigator.serviceWorker.controller;
  statusEl.textContent =
    "Page : " + PAGE_BUILD +
    "\nContrôleur : " + (ctrl ? ctrl.scriptURL : "aucun") +
    (extra ? "\n" + extra : "");
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  window.addEventListener("load", async () => {
    try {
      // IMPORTANT : URL du SW unique à chaque ouverture.
      // Cela force un vrai téléchargement du sw.js courant.
      const probe = Date.now();
      const reg = await navigator.serviceWorker.register(
        "./sw.js?probe=" + probe,
        {scope:"./", updateViaCache:"none"}
      );

      try { await reg.update(); } catch(e) {}

      if (reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});

      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener("statechange", () => {
          if (w.state === "installed" && navigator.serviceWorker.controller) {
            w.postMessage({type:"SKIP_WAITING"});
          }
        });
      });

      showStatus("Vérification réseau effectuée");
    } catch (e) {
      showStatus("Erreur : " + e);
    }
  });
} else {
  statusEl.textContent = "Service worker non supporté";
}
</script>
</body>
</html>
